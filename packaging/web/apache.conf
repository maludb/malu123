# Malu123 for the browser at /malu123/ (package malu123-web). Enabled by the package's
# postinst where apache2 is installed: a2enconf malu123-web.
Alias /malu123 /usr/share/malu123-web
<Directory /usr/share/malu123-web>
    Options -Indexes
    AllowOverride None
    Require all granted
    AddType application/wasm .wasm
    AddType text/javascript .js
    Header set X-Content-Type-Options "nosniff"
    <FilesMatch "\.(wasm|js)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/wasm text/javascript text/html
    </IfModule>
</Directory>
