<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Malu123 app icon: a worksheet with a highlighted header row and a rising column series,
       on the MaluOS navy tile. Original work for Malu123 (MIT OR Apache-2.0), hand-written
       geometry; not modelled on any vendor's spreadsheet logo (no letters, no X, no overlapping
       panels). Palette: MaluOS navy #16213a, paper #f4f1ea, Malu123 green #2fa36b. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#16213a"/>
    <!-- the sheet -->
    <rect x="88" y="96" width="336" height="336" rx="20" fill="#f4f1ea"/>
    <!-- header row and row-number column -->
    <path d="M88 116 a20 20 0 0 1 20 -20 H404 a20 20 0 0 1 20 20 V160 H88 Z" fill="#2fa36b"/>
    <path d="M88 160 H144 V432 H108 a20 20 0 0 1 -20 -20 Z" fill="#2fa36b" opacity="0.35"/>
    <!-- grid lines -->
    <path d="M88 228 H424 M88 296 H424 M88 364 H424 M144 160 V432 M214 160 V432 M284 160 V432 M354 160 V432"
          fill="none" stroke="#16213a" stroke-opacity="0.18" stroke-width="6"/>
    <!-- a rising column series drawn over the grid -->
    <rect x="166" y="330" width="40" height="80" rx="6" fill="#16213a"/>
    <rect x="236" y="286" width="40" height="124" rx="6" fill="#16213a"/>
    <rect x="306" y="236" width="40" height="174" rx="6" fill="#2fa36b"/>
    <rect x="376" y="194" width="34" height="216" rx="6" fill="#2fa36b"/>
    <!-- the active cell outline with its fill handle -->
    <rect x="214" y="160" width="70" height="68" fill="none" stroke="#16213a" stroke-width="10"/>
    <rect x="274" y="218" width="20" height="20" fill="#16213a" stroke="#f4f1ea" stroke-width="4"/>
  </g>
</svg>
